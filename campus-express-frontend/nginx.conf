# ============================================================
# 前端 Nginx 站点配置（容器内 /etc/nginx/conf.d/default.conf）
# 1. 托管 Vite 构建产物 dist，SPA 路由刷新回落 index.html
# 2. 反向代理 /api、/uploads、/ws 到后端容器 backend:8080
#    —— 与开发环境 vite.config.js 的 proxy 规则保持一致，生产无需再改前端代码
# ============================================================
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # 静态资源带 hash 指纹，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 前端路由：任意路径刷新都回落到 index.html，交由 Vue Router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口：保留 /api 前缀（与 Controller 的 @RequestMapping("/api/...") 一致）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传的静态资源（头像等），img 标签直接访问、不带 token
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket 实时推送：必须透传 Upgrade / Connection 头，并放宽读超时
    location /ws {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # Knife4j 在线 API 文档：经前端端口也能直接查看
    location /doc.html {
        proxy_pass       http://backend:8080;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass       http://backend:8080;
        proxy_set_header Host $host;
    }
    location /webjars/ {
        proxy_pass       http://backend:8080;
        proxy_set_header Host $host;
    }
}