# ============================================================
# 校园快递代取平台 - CI 流水线
#
# 触发：push 到 main / master，以及针对它们的 PR
# 三个并行/串行任务：
#   1. backend-test   起 MySQL 服务 → 初始化库表 → 跑全量测试 → 上传覆盖率与压测报告
#   2. frontend-build 安装依赖 → 构建前端产物
#   3. docker-build   校验前后端 Dockerfile 能真实构建（容器化交付物可复现）
# ============================================================
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:

  # ---------- 后端：全量测试 + 覆盖率 ----------
  backend-test:
    name: 后端测试与覆盖率
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: campus_express
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 初始化数据库（开发库 + 独立测试库）
        run: |
          set -e
          # 按依赖顺序建表：基础结构 → 通知表 → 信誉流水 → 头像字段 → 支付密码字段
          for f in docker/mysql-init/*.sql; do
            echo ">> 执行 $f"
            mysql -h 127.0.0.1 -P 3306 -uroot -p123456 < "$f"
          done
          # 克隆一份纯结构到测试库：测试用例跑在 campus_express_test，避免污染开发库种子数据
          mysql -h 127.0.0.1 -P 3306 -uroot -p123456 \
            -e "CREATE DATABASE IF NOT EXISTS campus_express_test DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"
          mysqldump -h 127.0.0.1 -P 3306 -uroot -p123456 --no-data --skip-add-drop-table campus_express \
            | mysql -h 127.0.0.1 -P 3306 -uroot -p123456 campus_express_test
          echo ">> 数据库就绪"

      - name: 运行全量测试
        working-directory: campus-express-backend
        run: mvn -B test

      - name: 汇总测试结果
        if: always()
        working-directory: campus-express-backend
        run: |
          total=0; failures=0; errors=0
          for f in target/surefire-reports/*.txt; do
            [ -e "$f" ] || continue
            line=$(grep -m1 'Tests run:' "$f" || true)
            [ -z "$line" ] && continue
            t=$(echo "$line" | sed -n 's/.*Tests run: \([0-9]*\), Failures: \([0-9]*\), Errors: \([0-9]*\).*/\1/p')
            fl=$(echo "$line" | sed -n 's/.*Tests run: \([0-9]*\), Failures: \([0-9]*\), Errors: \([0-9]*\).*/\2/p')
            er=$(echo "$line" | sed -n 's/.*Tests run: \([0-9]*\), Failures: \([0-9]*\), Errors: \([0-9]*\).*/\3/p')
            total=$((total + ${t:-0})); failures=$((failures + ${fl:-0})); errors=$((errors + ${er:-0}))
          done
          {
            echo "## 后端测试结果"
            echo ""
            echo "| 指标 | 数值 |"
            echo "| --- | --- |"
            echo "| 用例总数 | $total |"
            echo "| 失败 | $failures |"
            echo "| 错误 | $errors |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "用例总数=$total 失败=$failures 错误=$errors"

      - name: 上传 JaCoCo 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: campus-express-backend/target/site/jacoco/
          if-no-files-found: warn

      - name: 上传压测报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-test-report
          path: campus-express-backend/docs/load-test-report.*
          if-no-files-found: warn

  # ---------- 前端：构建校验 ----------
  frontend-build:
    name: 前端构建
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: campus-express-frontend/package-lock.json

      - name: 安装依赖
        working-directory: campus-express-frontend
        run: npm ci

      - name: 构建产物
        working-directory: campus-express-frontend
        run: npm run build

  # ---------- 交付物：Dockerfile 构建校验 ----------
  docker-build:
    name: 镜像构建校验
    runs-on: ubuntu-24.04
    needs: [ backend-test, frontend-build ]
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建后端镜像
        uses: docker/build-push-action@v7
        with:
          context: ./campus-express-backend
          push: false
          tags: campus-express-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: 构建前端镜像
        uses: docker/build-push-action@v7
        with:
          context: ./campus-express-frontend
          push: false
          tags: campus-express-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend